apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
 name: order-service-secret-configuration
 namespace: order-service
spec:
 refreshInterval: "24h"
 secretStoreRef:
   name: aws-parameterstore-store
   kind: ClusterSecretStore
 target:
   name: order-service-secret
 data:
 - secretKey: TEST_SECRET
   remoteRef:
     key: /product-service/title #  SSM에 생성한 파라미터 경로

 - secretKey: KAFKA_BOOTSTRAP_SERVERS
   remoteRef:
     key: /kafka/bootstrap-servers # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_KEY_PASSWORD
   remoteRef:
     key: /kafka/key-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_KEYSTORE_PASSWORD
   remoteRef:
     key: /kafka/keystore-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_TRUST_PASSWORD
   remoteRef:
     key: /kafka/trust-password # SSM에 생성한 파라미터 경로
 - secretKey: KAFKA_TRUSTSTORE
   remoteRef:
     key: /kafka/truststore  # 파라미터 스토어에서 truststore.jks를 base64로 인코딩한 값
 - secretKey: KAFKA_KEYSTORE
   remoteRef:
     key: /kafka/keystore  # 파라미터 스토어에서 keystore.jks를 base64로 인코딩한 값
