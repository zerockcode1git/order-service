apiVersion: apps/v1
kind: Deployment
metadata:
 name: order-service
 namespace: order-service
 annotations:
    # 참조 중인 K8s Secret / ConfigMap 변경 시 자동 Rolling Restart
    reloader.stakater.com/auto: "true"

 labels:
   app: order-service
spec:
 replicas: 2
 selector:
   matchLabels:
     app: order-service
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 template:
   metadata:
     labels:
       app: order-service

   spec:
     containers:
       - name: order-service
         image: zerockcode1/order-service:sha-d3ff413
         imagePullPolicy: Always
         ports:
           - containerPort: 8084
         envFrom:
           - configMapRef:
               name: order-service-config
           - secretRef:
              name: order-service-secret          
         resources:
           requests:
             cpu: "100m"
             memory: "256Mi"
           limits:
             cpu: "500m"
             memory: "512Mi"
         livenessProbe:
           httpGet:
             path: /actuator/health/liveness
             port: 8084
           initialDelaySeconds: 30
           periodSeconds: 15
           failureThreshold: 3
         readinessProbe:
           httpGet:
             path: /actuator/health/readiness
             port: 8084
           initialDelaySeconds: 20
           periodSeconds: 10
           failureThreshold: 3
     terminationGracePeriodSeconds: 30
